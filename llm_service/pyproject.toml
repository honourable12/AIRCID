[project]
name = "llm-service"
version = "0.1.0"
description = "FastAPI LLM application with RAG, form generation, summarization, and criteria augmentation."
authors = [{email = "neequayephilipanash@gmail.com" }]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "chromadb>=1.0.13",
    "fastapi>=0.115.13",
    "groq>=0.29.0",
    "jsonschema>=4.24.0",
    "langchain-groq>=0.3.5",
    "langchain>=0.3.26",
    "langchain-community>=0.3.26",
    "pillow>=11.3.0",
    "pydantic>=2.11.7",
    "pypdf>=5.7.0",
    "pytesseract>=0.3.13",
    "python-dotenv>=1.1.1",
    "python-multipart>=0.0.20",
    "sentence-transformers>=5.0.0",
    "sqlalchemy>=2.0.41",
    "uvicorn>=0.34.3",
    "pyjwt>=2.10.1",
    "importlib-resources>=6.4.0",
]

[tool.uv]
dev-dependencies = [
    "pytest==8.2.2",
    "pytest-asyncio==0.23.6",
    "httpx==0.27.0",
]
[tool.pytest.ini_options]
pythonpath = "."
asyncio_mode = "auto"
